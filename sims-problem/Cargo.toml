[package]
name = "sims-problem"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "sims_problem"
crate-type = ["cdylib"]

[features]
default = ["bounds_check", "parallel"]
plotting = ["pls/plotting"]
# The exact phase only. The CBC and HiGHS backends are deliberately NOT pulled
# in: the published results use Gurobi throughout, and those two are the only
# reason a build would need cmake, a C++ toolchain and the system CBC library
# (HiGHS is compiled from source; coin_cbc_sys probes for `cbc` via
# pkg-config). Add them explicitly -- `--features gurobi,highs` -- if you want
# `generate_pseudo.py --solver highs` or `--solver coin_cbc`.
milp = ["augmecon"]
highs = ["milp", "augmecon/highs"]
coin_cbc = ["milp", "augmecon/coin_cbc"]
# Native Gurobi backend (grb linked-library, via the good_lp fork's `gurobi`
# branch). Opt-in on top of milp: building it needs a licensed Gurobi install
# (set up GUROBI_HOME with scripts/fetch-gurobi.sh) and a valid license to solve.
gurobi = ["milp", "augmecon/gurobi", "dep:psbox", "psbox/gurobi"]
bounds_check = ["pls/bounds_check"]
parallel = ["pls/parallel"]
scalarized_selection = ["pls/scalarized_selection"]
external_solvers = ["pls/external_solvers"]

[dependencies]
nd-tree = { path = "../nd-tree", version = "0.1.0", default-features = false }
pyo3 = { version = "0.27.2", features = ["extension-module"] }
pls = { path = "../sims-heuristics", package = "sims-heuristics", version = "0.1.0", default-features = false, features = ["bitmaps"] }
pareto = { path = "../pareto", version = "0.1.0" }
augmecon = { path = "../augmecon-rs", version = "0.1.0", optional = true }
# Exact biobjective front generation by Pascoletti-Serafini box search. Kept
# independent of augmecon so the two first-phase algorithms share no solver
# layer and can be compared without a common defect flattering both.
psbox = { path = "../psbox", version = "0.1.0", optional = true }
sims-dzn = { path = "../sims-dzn", version = "0.1.0" }
log = "0.4.29"
pyo3-log = "0.13.2"
tar = "0.4.44"
flate2 = "1.1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json", "fmt"] }
tracing-chrome = "0.7.2"
indicatif = "0.17"
rayon = "1.10"

# Cargo only honours [patch] sections declared in the *root* manifest of the
# crate being built, so this duplicates what augmecon-rs declares for when it
# is the build root instead.
#
# `moors` and `optirustic` are deliberately NOT patched here. They reach this
# crate only through sims-heuristics' `external_solvers` feature, which this
# extension never enables (`pls` is taken with default-features = false and
# only `bitmaps`), so patching them would force every build of this crate to
# run `cargo patch-crate` in sims-heuristics for sources it never compiles.
# Build sims-heuristics standalone if you want that feature.
#
# See augmecon-rs/Cargo.toml for why `grb` 3.0.1 must be patched; the patch
# lives there and `cargo patch-crate` writes the result to this path.
[patch.crates-io]
grb = { path = "../augmecon-rs/target/patch/grb-3.0.1" }
